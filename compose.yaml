services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${RELAY_DB_PASSWORD:?Set RELAY_DB_PASSWORD in an ignored .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U relay -d relay']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  relay:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?Set RELAY_DATABASE_URL for the database service}
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Generate with relay keygen}
      RELAY_MASTER_KEY: ${RELAY_MASTER_KEY:?Generate with relay keygen}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:?Set the client-facing URL}
      RELAY_TRUSTED_CIDRS: ${RELAY_TRUSTED_CIDRS:-}
      RELAY_WORKERS: ${RELAY_WORKERS:-2}
      RELAY_PROXIES: ${RELAY_PROXIES:-}
    ports:
      - '${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-8080}:8080'
    volumes:
      - relay-data:/var/lib/relay
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
volumes:
  postgres-data:
  relay-data:
